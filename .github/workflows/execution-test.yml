name: Test d'exécution réelle

# Lancement manuel uniquement : ouvre la plus petite position BTC possible (≈ 11 $), pose stop et
# objectif, vérifie, puis ferme tout. Coût : quelques centimes.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aller-retour réel sur BTC
        env:
          HL_API_PRIVATE_KEY: ${{ secrets.HL_API_PRIVATE_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m agent execution-test | tee -a "$GITHUB_STEP_SUMMARY"
